name: series
# 매일 공개 수치 파일(data/series.json) 갱신. 열쇠 = 저장소 비밀값 ECOS_API_KEY · FRED_API_KEY
on:
  schedule:
    - cron: "40 22 * * *"   # 한국 07:40
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 받기
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python tools/fetch_series.py
      - name: 공개 검사
        env:
          ECOM_HASH_KEY: ${{ secrets.ECOM_HASH_KEY }}
        run: pip install -q lxml && python tools/check_public.py
      - name: 커밋
        run: |
          git config user.name "ecom-slide bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/series.json
          git diff --cached --quiet || (git commit -m "data: series $(date -u +%F)" && git push)

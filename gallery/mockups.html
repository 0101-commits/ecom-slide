/* ECOM 발표 엔진 3판 — 꼬리표 · 헤드메시지 2줄 · 꽉 찬 본문 · 왼쪽 아래 각주 · 오른쪽 아래 로고
   색 = ECOM CI(Kick-off 부록 18쪽) 초록 #00744F · 짙은 초록 #005136 + 회색 단계. 장 크기 1280×720 고정, 창에 맞춰 늘림 */
:root{
  color-scheme:light;
  --g:#00744F; --gdk:#005136; --g65:#4D9E83; --g40:#99C7B9; --g18:#D1E8E0; --g08:#ECF5F1; --gon:#8FD9B6;
  --cmp:#3E4743; --gray:#C9D1CD; --light:#E1E6E3; --grid:#E3E8E5; --axis:#9AA3A0; --mute:#6B7570; --ink:#1D2521; --sub:#3E4743;
  --paper:#F5F7F6; --well:#EEF3F0; --line:#DDE3E0; --warn:#B4461E;
  --font:'Pretendard','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#E9EDEB;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
body{overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;outline:none}
#deck{position:relative;width:1280px;height:720px;transform-origin:50% 50%;flex:0 0 auto;overflow:hidden;background:#fff;box-shadow:0 10px 40px rgba(0,40,25,.12)}
.sl{position:absolute;left:0;top:0;width:1280px;height:720px;background:#fff;color:var(--ink);font-family:var(--font);overflow:hidden;line-height:1.4;letter-spacing:-.01em;display:none}
.sl.on{display:block}
.sl svg text{font-family:var(--font)}
.sl svg{overflow:visible}
/* 머리 */
.sl .tag{position:absolute;left:56px;top:26px;right:330px;font-size:15px;font-weight:700;color:var(--g);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl .tag span{font-weight:500;margin-left:12px}
.sl .tag em{font-style:normal;font-weight:500;color:var(--mute);margin-left:10px;font-size:14px}
.sl .hm{position:absolute;left:56px;right:70px;top:52px;font-size:24px;line-height:1.48;font-weight:500;color:var(--ink)}
.sl .hm b{font-weight:700;color:var(--gdk)}
.sl .bd{position:absolute;left:56px;right:56px;top:144px;bottom:64px}
.sl .bd>svg.cv{position:absolute;left:0;top:0}
/* 하단 */
.sl .fn{position:absolute;left:56px;bottom:14px;font-size:12.5px;line-height:1.5;color:var(--mute);max-width:980px}
.sl .lg{position:absolute;right:56px;bottom:16px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute);font-weight:600;font-variant-numeric:tabular-nums}
.sl .lg img{height:22px;display:block}
.sl .lk{position:absolute;right:56px;top:22px;display:flex;gap:6px;z-index:3}
.sl .lk a,.sl .back{font-size:13px;font-weight:700;border:1px solid #C9D2CD;border-radius:999px;padding:3px 12px;color:var(--sub);background:#fff;text-decoration:none;cursor:pointer;white-space:nowrap}
.sl .lk a:hover,.sl .back:hover{border-color:var(--g);color:var(--gdk)}
.sl .back{position:absolute;right:0;bottom:0;z-index:3}
/* 범례 · 공통 글 */
.leg{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13.5px;color:var(--sub);align-items:center}
.leg .ln{display:inline-block;width:22px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.leg .bx{display:inline-block;width:13px;height:11px;border-radius:2px;vertical-align:middle;margin-right:6px}
.ph{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.ph i{font-style:normal;width:19px;height:19px;border-radius:50%;background:var(--gdk);color:#fff;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.num{font-variant-numeric:tabular-nums}
/* 카드 · 칸 */
.card{position:absolute;border:1px solid var(--line);border-radius:14px;background:#fff}
.card.now{border:2px solid var(--g);background:var(--g08)}
.chip2{display:inline-block;font-size:13.5px;font-weight:700;border-radius:999px;padding:3px 11px;background:#EEF0F1;color:var(--sub);white-space:nowrap}
.chip2.up{background:var(--g08);color:var(--gdk)}
.chip2.dn{background:#F6EDE8;color:var(--warn)}
.chip2.dk{background:var(--cmp);color:#fff}
.chip2.g{background:var(--g);color:#fff}

    if (n.chart) K.mini(K.svg(ctx), n.chart, 250, ny + 44, LW - 250 - 28, nh - 90, 6, 1700) }
  if (!n && s.ex) K.D(bd, 'kx k-tmx', 0, ny, LW, nh, '<b>' + h.esc(s.ex.title || '구성') + '</b><div>' + (s.ex.items || []).map(function (x) { return '<span>' + h.md(x) + '</span>' }).join('') + '</div>', { 'data-b': 4, 'data-fx': 'rise' });
  if (rel.length) K.D(bd, 'kx k-tmr', 0, 512 - relH, LW, relH, '<i>관련 용어</i>' + rel.map(function (r) { return '<span data-b="6" data-fx="pop">' + h.esc(r) + '</span>' }).join(''), {});

})();

/* tree — 논리 나무(왼쪽 → 오른쪽) : 뿌리 → 줄기 선 → 가지 상자 → 가지마다 잎 선 · 잎 상자
   root{title,sub,value} · branches[2~4]{title,sub,tone,leaves:[{title,text,value}]} · beats[{spot:가지}] */
(function () {
'use strict';
var h = ECOM.h, C = ECOM.C, E = h.E, K = ECOM.kx;

  var RX = 0, RW = 214, BX = 274, BW = 236, LX = 566, LW = 1168 - LX, lg = 10, bgp = 22, lh = Math.min(86, (512 - (nL - B) * lg - (B - 1) * bgp) / nL);
  var svg = K.svg(ctx), y = 0, grp = br.map(function () { return [] }), spans = [];
  var used = nL * lh + (nL - B) * lg + (B - 1) * bgp, oy = (512 - used) / 2; y = oy;
  br.forEach(function (b, i) { var ls = b.leaves || [], a = y; ls.forEach(function () { y += lh + lg }); y -= lg; spans.push([a, y]); y += bgp });
  var rh = Math.min(240, used), ry = 256 - rh / 2, cy = 256;
  K.D(bd, 'kx k-trr', RX, ry, RW, rh, '<b>' + h.md(rt.title || '') + '</b>' + (rt.value ? '<em>' + h.md(rt.value) + '</em>' : '') + (rt.sub ? '<span>' + h.md(rt.sub) + '</span>' : ''), { 'data-at': 0, 'data-fx': 'pop', 'data-ms': 420 });
  var t1 = 380, li = 0;
  br.forEach(function (b, i) { var sp = spans[i], by = (sp[0] + sp[1]) / 2, bH = Math.min(sp[1] - sp[0], 128), tone = h.col(b.tone || (['main', 'dark', 'g65', 'cmp'][i] || 'main')), tb = t1 + 260 + i * 140;
    var pth = E('path', { d: 'M' + (RX + RW) + ' ' + cy + ' H' + (RX + RW + 30) + ' V' + by + ' H' + (BX - 2), fill: 'none', stroke: C.g65, 'stroke-width': 2, 'data-at': t1 + i * 140, 'data-fx': 'draw', 'data-ms': 360 }, svg);
    var bx = K.D(bd, 'kx k-trb', BX, by - bH / 2, BW, bH, '<b>' + h.md(b.title || '') + '</b>' + (b.sub ? '<span>' + h.md(b.sub) + '</span>' : ''), { 'data-at': tb, 'data-fx': 'left', 'data-ms': 380 }); bx.style.background = tone;
    grp[i].push(pth, bx);

    (b.leaves || []).forEach(function (l, j) { var my = ly + lh / 2, tl = t1 + 260 + B * 140 + 200 + li * 150;
      var lp = E('path', { d: 'M' + (BX + BW) + ' ' + by + ' H' + (BX + BW + 26) + ' V' + my + ' H' + (LX - 2), fill: 'none', stroke: C.gray, 'stroke-width': 1.8, 'data-at': tl, 'data-fx': 'draw', 'data-ms': 300 }, svg);
      var dt = E('circle', { cx: LX - 2, cy: my, r: 3.5, fill: tone, 'data-at': tl + 260, 'data-fx': 'fade' }, svg);
      var lb = K.D(bd, 'kx k-trl', LX + 6, ly, LW - 6, lh, '<i style="background:' + tone + '"></i><div><b>' + h.md(l.title || '') + '</b>' + (l.text ? '<span>' + h.md(l.text) + '</span>' : '') + '</div>' + (l.value ? '<em>' + h.md(l.value) + '</em>' : ''),
        { 'data-at': tl + 180, 'data-fx': 'rise', 'data-ms': 320 });
      grp[i].push(lp, dt, lb); ly += lh + lg; li++ }) });
  grp.forEach(function (g) { g.forEach(function (e) { e.classList.add('k-dimx') }) });
  root._beat = function (k) { var b = k > 0 && s.beats && s.beats[k - 1], sp = b ? b.spot : null; grp.forEach(function (g, i) { g.forEach(function (e) { e.classList.toggle('k-dim', sp != null && i !== sp) }) }) } };
})();
